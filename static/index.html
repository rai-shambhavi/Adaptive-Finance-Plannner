<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adaptive Financial Planner</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e7eaf3;--g:#2f9e6e;--gd:#1f7a56;--gl:#e6f5ee;--o:#e0892b;--ol:#fdf1e1;--r:#d9534f;--tint:#eff2fb;--dark:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px;height:52px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.brand{font-size:9px;letter-spacing:.08em;font-weight:700}.top nav{display:flex;gap:26px;height:100%}
.top nav button{border:0;background:none;color:var(--mut);height:100%;padding:0 2px;border-bottom:2px solid transparent}.top nav .on{color:var(--ink);font-weight:600;border-color:var(--ink)}
.right{display:flex;justify-content:flex-end;align-items:center;gap:14px;position:relative}.bell{border:0;background:none;position:relative;font-size:15px}.bell b{position:absolute;top:-4px;right:-5px;background:var(--r);color:#fff;border-radius:8px;font-size:9px;padding:0 4px}
.av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#2f9e6e,#6c7a96);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
main{max-width:1010px;margin:0 auto;padding:26px 20px 70px}.v{display:none}.v.on{display:block}
h1{font-size:19px;margin:0}h2{font-size:14px;margin:0}h3{font-size:12px;margin:0}.sub{color:var(--mut);font-size:12px;margin:2px 0 18px}.mut{color:var(--mut)}.sm{font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.g4{display:grid;gap:12px;grid-template-columns:repeat(4,1fr);margin-bottom:14px}.g4 .card{margin:0;padding:12px 14px}.g2{display:grid;gap:14px;grid-template-columns:1fr 1fr}.g2 .card{margin:0}
.lab{font-size:9px;letter-spacing:.06em;color:var(--mut);font-weight:600;text-transform:uppercase}.big{font-size:20px;font-weight:700;margin:3px 0}.big small{font-size:12px;color:var(--mut);font-weight:400}
.pill{display:inline-block;padding:1px 8px;border-radius:5px;font-size:10px;font-weight:600;background:var(--tint);color:var(--mut)}.pill.g{background:var(--gl);color:var(--gd)}.pill.o{background:var(--ol);color:var(--o)}
.btn{background:var(--dark);color:#fff;border:0;border-radius:6px;padding:7px 14px;font-weight:600;font-size:12px}.btn.l{background:#f1f3f9;color:var(--ink);border:1px solid var(--line)}.btn[disabled]{opacity:.35;cursor:default}
.pg{height:5px;border-radius:3px;background:#e8ebf3;overflow:hidden}.pg i{display:block;height:100%;background:var(--g);border-radius:3px}.pg.o i{background:var(--o)}
.goal{margin:13px 0}.goal .row{font-size:12px;margin-bottom:4px}.goal .r{text-align:right;font-size:10px;color:var(--mut);margin-top:3px}
.legend div{display:flex;align-items:center;gap:7px;margin:5px 0;font-size:11px}.legend i{width:8px;height:8px;border-radius:50%}
.risk{display:flex;gap:28px;align-items:center}.risk h2{font-size:15px;margin:8px 0 4px}
/* questionnaire */
.qwrap{max-width:560px;margin:10px auto}.qwrap h1{text-align:center;font-size:20px}.qwrap .sub{text-align:center}.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:7px;padding:11px 13px;margin:9px 0;font-size:12.5px}
.opt:hover{border-color:#b9c1d3}.opt.on{background:var(--gl);border:1.5px solid var(--g);font-weight:600}.opt u{width:13px;height:13px;border-radius:50%;border:1.5px solid #b9c1d3}.opt.on u{border:4px solid var(--g);background:#fff}
details.pv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:14px}details summary{cursor:pointer;display:flex;gap:8px;align-items:center;font-size:12px;font-weight:500;list-style:none}
/* roadmap */
.road{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;position:relative;margin:14px 0}.road:before{content:"";position:absolute;left:5%;right:5%;top:36px;border-top:1px solid #c9d0e2}
.st{position:relative;background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center;font-size:10px}.st b{display:block;font-size:11px;margin-top:2px}.st .ic{width:24px;height:24px;border-radius:6px;margin:0 auto 4px;display:grid;place-items:center;background:var(--gl);color:var(--gd);font-weight:700;font-size:12px}
.st.act{background:#fff;border:1.5px solid var(--g)}.st.focus{background:#fff7ec;border-color:#f1c791}.st.focus .ic{background:var(--ol);color:var(--o)}.st .y{font-size:12px;font-weight:700}.st p{margin:5px 0 0;color:var(--mut);font-size:9.5px}
.lg{display:flex;gap:12px;font-size:10px;color:var(--mut)}.lg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.beh{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.beh div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;gap:9px;align-items:center}.beh .ic{width:26px;height:26px;border-radius:6px;background:var(--gl);display:grid;place-items:center;color:var(--gd);font-weight:700}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.ms>div{background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:10px}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.rec>div{background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:5px}.rec .btn{width:100%;margin-top:auto}
.ad .rw{display:flex;justify-content:space-between;align-items:center;background:var(--tint);border-radius:7px;padding:9px 12px;margin-top:8px;font-size:12px}.ad input{width:90px;border:1px solid var(--line);border-radius:5px;padding:3px 6px;font:inherit;text-align:right;font-weight:600}
/* modal */
#m{position:fixed;inset:0;background:#0b122066;display:none;place-items:center;z-index:30;padding:16px}#m.on{display:grid}#mb{background:#fff;border-radius:12px;padding:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto}
#mb table{width:100%;border-collapse:collapse;font-size:12px}#mb td,#mb th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}#mb td:first-child,#mb th:first-child{text-align:left}#mb input,#mb select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font:inherit}
.gr{display:grid;grid-template-columns:2fr 1.3fr 1.3fr .7fr 1.2fr 1.2fr auto;gap:6px;margin-bottom:6px}.pop{position:absolute;top:34px;right:0;width:310px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 8px 24px #0001;display:none}.pop.on{display:block}
.note{background:var(--ol);color:#8a5a14;border-radius:7px;padding:8px 12px;font-size:12px;margin-bottom:12px}
@media(max-width:820px){.g4,.g2,.rec,.ms,.beh{grid-template-columns:1fr 1fr}.road{grid-template-columns:repeat(2,1fr)}.road:before{display:none}.top{grid-template-columns:auto 1fr}.brand{display:none}.risk{flex-direction:column;align-items:flex-start}.gr{grid-template-columns:1fr 1fr}}
@media print{.top,.btn,#m{display:none!important}.v{display:block!important}}
</style></head><body>
<header class="top"><div class="brand">ADAPTIVE FINANCIAL PLANNER</div><nav id="nav"></nav><div class="right"><button class="bell" id="bell" onclick="togglePop()" aria-label="Reminders">🔔</button><div class="pop" id="pop"></div><div class="av">U</div><span>User ▾</span></div></header>
<main><section class="v on" id="v0"></section><section class="v" id="v1"></section><section class="v" id="v2"></section></main>
<div id="m" onclick="if(event.target.id=='m')closeM()"><div id="mb"></div></div>
<script>
const $=id=>document.getElementById(id),pc=x=>Math.round(x*100)+"%",
inrs=n=>n>=1e7?"₹"+(n/1e7).toFixed(2)+"Cr":n>=1e5?"₹"+(n/1e5).toFixed(2)+"L":"₹"+Math.round(n).toLocaleString("en-IN"),
api=(u,b)=>fetch("/api/"+u,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{}).then(r=>r.json()),
lvl=v=>v>=70?"High":v>=45?"Moderate":"Low";
const DEF={goals:[{name:"Emergency Fund",category:"Other",target_today:300000,years:1,current_corpus:210000,monthly_sip:9000,priority:1},{name:"Higher Education",category:"Education",target_today:1000000,years:4,current_corpus:520000,monthly_sip:12500,priority:2},{name:"Home Purchase",category:"Home",target_today:3500000,years:8,current_corpus:1085000,monthly_sip:17000,priority:2}],
 cash:{inc:100000,exp:50000,em:4,dep:1},hold:{"Large-cap equity":[230000,280000],"Mid/small-cap equity":[90000,110000],"Debt (short/medium)":[215000,220000],"Gold":[60000,80000],"Liquid/emergency":[40000,40000]}};
let S=JSON.parse(localStorage.getItem("afp2")||"null")||{goals:DEF.goals,cash:DEF.cash,hold:DEF.hold,ans:{},qi:0,sample:true};
const save=()=>localStorage.setItem("afp2",JSON.stringify(S));
const COL=["#3b4a63","#7b88a6","#f0a73a","#3aa57b","#c3cadb"],TABS=["Dashboard","Questionnaire","Timeline & Recommendations"];let Q,QS;
$("nav").innerHTML=TABS.map((t,i)=>`<button id="n${i}" onclick="tab(${i})">${t}</button>`).join("");
function tab(i){TABS.forEach((_,j)=>{$("v"+j).classList.toggle("on",i==j);$("n"+j).classList.toggle("on",i==j)});$("pop").classList.remove("on");scrollTo(0,0)}
function modal(h){$("mb").innerHTML=h;$("m").classList.add("on")}function closeM(){$("m").classList.remove("on")}onkeydown=e=>{if(e.key=="Escape")closeM()};
/* ---------- questionnaire ---------- */
function buildQS(){const L=i=>Q.quiz[i].options.map(o=>[o,Q.quiz[i].options.indexOf(o)]);
 QS=[{k:"age",q:"What is your age group?",o:[["Under 30",28],["30–44",37],["45–54",50],["55 or above",58]]},
 {k:"income",q:"What is your annual household income?",o:[["Less than ₹3 lakh","Less than 3 Lakhs"],["₹3–6 lakh","3 to 6 Lakhs"],["₹6–10 lakh","6 to 10 lakhs"],["More than ₹10 lakh","More than 10 lakhs"]]},
 {k:"em",q:"How many months of expenses do you keep as an emergency fund?",o:[["Less than 3 months",2],["3–6 months",4],["6–12 months",8],["More than a year",12]]},
 {k:"dep",q:"How many people depend on your income?",o:[["No one",0],["1–2 people",1],["3 or more",3]]},
 {k:"b_loss_aversion",q:"How do you feel about losing ₹10,000 compared with gaining ₹10,000?",o:[["A loss doesn't bother me more than a gain",1],["Both feel about equal",2],["A loss stings more than a gain pleases",4],["I avoid any chance of loss, even if it costs me gains",5]]},
 {k:"b_panic",q:"How would you react if your investment temporarily lost 20% of its value?",o:[["Sell my investments",5],["Reduce my investments",4],["Hold my investments",2],["Invest more",1]]},
 {k:"b_overconfidence",q:"How confident are you that you can beat the market by picking stocks or timing entries?",o:[["Not at all",1],["Slightly",2],["Fairly confident",4],["Very confident",5]]},
 {k:"b_fomo",q:"Markets rally 30% in a year. What do you do?",o:[["Stick to my plan",1],["Add a little",2],["Add a lot so I don't miss out",4],["Move savings into the rally",5]]},
 {k:"b_herding",q:"A friend recommends a popular investment. You…",o:[["Research and decide alone",1],["Check a few opinions first",2],["Usually follow",4],["Always follow the crowd",5]]},
 {k:"b_anchoring",q:"One of your investments is below your purchase price. You…",o:[["Judge it on future outlook",1],["Partly consider the purchase price",2],["Wait until I break even",4],["Never sell at a loss",5]]},
 {k:"q_0",q:Q.quiz[0].q,o:L(0)},{k:"q_1",q:Q.quiz[1].q,o:L(1)},{k:"q_4",q:Q.quiz[4].q,o:L(4)}]}
function answers(){const a={age:37,income:"6 to 10 lakhs",emergency_months:4,dependents:1,bias:{},quiz:{}};
 QS.forEach(q=>{const i=S.ans[q.k];if(i==null)return;const v=q.o[i][1];if(q.k=="age")a.age=v;else if(q.k=="income")a.income=v;else if(q.k=="em")a.emergency_months=v;else if(q.k=="dep")a.dependents=v;else if(q.k[0]=="b")a.bias[q.k.slice(2)]=v;else a.quiz[q.k.slice(2)]=v});return a}
function drawQ(){const q=QS[S.qi],n=QS.length,p=Math.round((S.qi+1)/n*100),sel=S.ans[q.k],r=S.pv;
 $("v1").innerHTML=`<div class="qwrap"><h1>Financial Profile</h1><p class="sub">Answer a few questions to understand your financial behaviour.</p>
 <div class="row"><span class="sm">Question ${S.qi+1} of ${n}</span><span class="sm" style="color:var(--g)">${p}% complete</span></div><div class="pg" style="margin:6px 0 16px;height:6px"><i style="width:${p}%;background:var(--gd)"></i></div>
 <div class="card" style="padding:20px"><h2 style="font-size:14.5px;margin-bottom:10px">${q.q}</h2>${q.o.map((o,i)=>`<button class="opt ${sel===i?"on":""}" onclick="pick(${i})">${o[0]}<u></u></button>`).join("")}
 <div class="row" style="margin-top:14px"><button class="btn l" ${S.qi?"":"disabled"} onclick="S.qi--;drawQ()">← Previous</button><button class="btn" ${sel==null?"disabled":""} onclick="nextQ()">${S.qi==n-1?"Finish ✓":"Next →"}</button></div></div>
 <details class="pv"><summary><span style="color:var(--g)">✓</span> Assessment Complete Preview ${r?`<span class="pill g">${r.label.toUpperCase()}</span>`:""}</summary>${r?`<p class="sm mut">Capacity ${r.capacity}/100 · Tolerance ${r.tolerance}/100 · Literacy ${r.fl_pct}%. This updates as you answer.</p>`:`<p class="sm mut">Answer a question to see your preview.</p>`}</details></div>`}
async function pick(i){S.ans[QS[S.qi].k]=i;S.pv=await api("risk-profile",answers());drawQ()}
async function nextQ(){if(S.qi<QS.length-1){S.qi++;return drawQ()}
 const a=answers();S.cash={...S.cash,em:a.emergency_months,dep:a.dependents};S.risk=await api("risk-profile",a);S.sample=false;await replan();S.base=snap();save();render();tab(0)}
/* ---------- plan ---------- */
const snap=()=>({inc:S.cash.inc,sip:S.plan.total_required_sip,prog:avgP()});const avgP=()=>S.plan.goals.reduce((s,g)=>s+g.success_prob,0)/S.plan.goals.length;
async function replan(){S.plan=await api("plan",{risk_label:S.risk.label,goals:S.goals,monthly_income:S.cash.inc,monthly_expenses:S.cash.exp,step_up:.05});save()}
const holdTot=()=>Object.values(S.hold).reduce((s,v)=>s+v[1],0),invTot=()=>Object.values(S.hold).reduce((s,v)=>s+v[0],0);
function health(){const c=S.cash,sr=Math.max(0,Math.min(1,(c.inc-c.exp)/c.inc/.3));return Math.round(100*(.3*Math.min(1,c.em/6)+.25*sr+.25*avgP()+.2*S.risk.fl_pct/100))}
const HEAD={"Very Conservative":["Capital protection comes first","Safety and steady income lead the plan, with most money in debt and liquid assets."],"Conservative":["Stability with modest growth","Your plan leans on debt and gold, with a small equity share to beat inflation."],"Moderate":["Balanced approach to growth and stability","Built for steady wealth accumulation while shielding your core goals from extreme market shocks."],"Moderately Aggressive":["Growth-led approach with managed risk","Equity drives the plan; debt and gold cushion drawdowns."],"Aggressive":["Maximum growth for long horizons","Most of your money sits in equity. Expect large swings along the way."]};
function gauge(score){const cx=100,cy=100,R=78,pt=(a,r=R)=>[cx+r*Math.cos(Math.PI-a*Math.PI/180),cy-r*Math.sin(Math.PI-a*Math.PI/180)],cols=["#e5675d","#a6cf84","#3aa57b","#f0b04a","#ea9a4e"];
 const arcs=cols.map((c,i)=>{const[a,b]=[pt(i*36),pt(i*36+34)];return `<path d="M${a[0]},${a[1]} A${R},${R} 0 0 1 ${b[0]},${b[1]}" stroke="${c}" stroke-width="12" fill="none"/>`}).join(""),n=pt(score*1.8,62);
 return `<svg viewBox="0 0 200 112" width="170">${arcs}<line x1="100" y1="100" x2="${n[0]}" y2="${n[1]}" stroke="#111827" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="#111827"/></svg>`}
function donut(){const t=holdTot(),C=2*Math.PI*46;let o=0;return `<svg viewBox="0 0 120 120" width="150"><g transform="rotate(-90 60 60)">${Object.entries(S.hold).map(([k,v],i)=>{const f=v[1]/t,s=`<circle cx="60" cy="60" r="46" fill="none" stroke="${COL[i]}" stroke-width="16" stroke-dasharray="${f*C-1} ${C}" stroke-dashoffset="${-o*C}"/>`;o+=f;return s}).join("")}</g><text x="60" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">${inrs(t)}</text></svg>`}
function render(){if(!S.risk||!S.plan)return;renderDash();renderTL();renderBell()}
function renderDash(){const r=S.risk,P=S.plan,h=new Date().getHours(),t=holdTot(),n=Object.values(S.hold).filter(v=>v[1]>0).length,on=P.goals.filter(g=>g.status=="On track").length,cap=v=>v>=70?"High":v>=45?"Medium":"Low";
 $("v0").innerHTML=`${S.sample?`<div class="note">Showing sample data. <a href="#" onclick="tab(1);return false">Take the questionnaire</a> to personalise your plan.</div>`:""}<h1>Good ${h<12?"morning":h<17?"afternoon":"evening"}, User</h1><p class="sub">Here's your financial plan at a glance.</p>
 <div class="g4"><div class="card"><div class="lab">Financial health</div><div class="big">${health()} <small>/ 100</small></div><div class="sm mut">Emergency fund, savings rate, goals and literacy</div></div>
 <div class="card"><div class="lab">Risk profile</div><div class="big" style="font-size:17px;margin:6px 0">${r.label.toUpperCase()}</div><div class="sm mut">${HEAD[r.label][0]}</div></div>
 <div class="card"><div class="lab">Portfolio</div><div class="big">${inrs(t)}</div><div class="sm mut">Invested ${inrs(invTot())} across ${n} asset classes</div></div>
 <div class="card"><div class="lab">Goal progress</div><div class="big">${pc(avgP())}</div><div class="sm mut">${on} of ${P.goals.length} targets currently on schedule</div></div></div>
 <div class="g2"><div class="card"><div class="row"><h2>Portfolio Overview</h2><span class="pill">${n} Asset Classes</span></div><div class="row" style="margin:12px 0"><div>${donut()}</div><div class="legend">${Object.entries(S.hold).map(([k,v],i)=>`<div><i style="background:${COL[i]}"></i>${k} <b>${Math.round(v[1]/t*100)}%</b></div>`).join("")}</div></div>
 <div class="row"><div class="sm"><b>Total Invested:</b> ${inrs(invTot())} &nbsp;<b>Current Value:</b> <span style="color:var(--g)">${inrs(t)}</span><div class="mut">Target mix: ${r.label}</div></div><button class="btn l" onclick="holdM()">View Details</button></div></div>
 <div class="card"><div class="row"><h2>Financial Goals</h2><span class="pill g" style="cursor:pointer" onclick="goalsM()">${P.goals.length} Active Goals · Edit</span></div>${P.goals.map(g=>{const f=Math.min(1,g.current_corpus/g.target_today);return `<div class="goal"><div class="row"><span>${g.name}</span><b style="color:var(--g)">${pc(f)}</b></div><div class="pg ${g.status=="On track"?"":"o"}"><i style="width:${f*100}%"></i></div><div class="r">${inrs(g.current_corpus)} / ${inrs(g.target_today)}</div></div>`}).join("")}<div style="text-align:right"><button class="btn l" onclick="tab(2)">View Timeline</button></div></div></div>
 <div class="card" style="margin-top:14px"><div class="risk"><div style="text-align:center">${gauge(r.score)}<div style="font-weight:700;font-size:11px;margin-top:-4px">● ${r.label.toUpperCase()}</div><div class="sm mut">Cons. · Moderate · Mod. Aggr. · Aggr.</div></div>
 <div style="flex:1"><span class="pill g">${r.label} Risk Profile</span> &nbsp;<span class="sm mut">Risk Capacity: <b style="color:var(--ink)">${cap(r.capacity)}</b> · Risk Tolerance: <b style="color:var(--ink)">${cap(r.tolerance)}</b></span><h2>${HEAD[r.label][0]}</h2><p class="mut" style="margin:0 0 12px">${HEAD[r.label][1]}</p>
 <div class="row"><span class="sm mut"><span style="color:var(--g)">✓</span> Calibrated from ${S.sample?"sample":Object.keys(S.ans).length} responses · Last updated: Today · <a href="#" onclick="whyM();return false" style="color:var(--ink)">Why this profile?</a></span><button class="btn" onclick="tab(2)">View Recommendations →</button></div></div></div></div>`}
/* ---------- timeline ---------- */
function stages(){const y0=new Date().getFullYear(),em=S.cash.em,st=[{y:y0,t:"Foundation & Reserve",c:em>=6?"done":"act",pill:em>=6?"100% Completed":`${em} of 6 months saved`,d:"Emergency buffer for job loss or medical needs",ic:"✓"}];
 S.plan.goals.forEach(g=>{const gap=Math.max(0,g.required_sip-g.current_sip);st.push({y:y0+Math.round(g.years),t:g.name,c:g.status=="On track"?"plan":"focus",pill:`${inrs(g.current_corpus)} / ${inrs(g.target_today)}`,d:gap>0?`+${inrs(Math.ceil(gap/500)*500)}/mo SIP boost suggested`:`${pc(Math.min(1,g.current_corpus/g.target_today))} funded on steady pace`,ic:"◎",g})});
 if(!S.plan.goals.some(g=>g.category=="Retirement"))st.push({y:y0+25,t:"Financial Freedom",c:"plan",pill:"Long-Term Goal",d:"Multi-asset compounding portfolio",ic:"✈"});
 st.push({y:y0+2,t:"Mid-Career Rebalance",c:"sched",pill:"Scheduled Review",d:"Asset allocation & tax loss harvesting",ic:"⇄"});st.sort((a,b)=>a.y-b.y);const f=st.find(s=>s.c!="done");if(f&&f.c!="focus")f.c="act";return st.slice(0,6)}
async function renderTL(){const P=S.plan,r=S.risk,st=stages(),y0=new Date().getFullYear(),b=S.base||snap(),first=P.goals.slice().sort((a,b)=>a.years-b.years)[0],end=new Date(Date.now()+first.years*365.25*864e5);
 const rb=await api("rebalance",{holdings:Object.fromEntries(Object.entries(S.hold).map(([k,v])=>[k,v[1]])),target:r.allocation.weights,threshold:.05,profile:r.label}),worst=P.goals.slice().sort((a,b)=>a.success_prob-b.success_prob)[0],gap=Math.max(0,Math.ceil((worst.required_sip-worst.current_sip)/500)*500);S.rb=rb;S.gap=gap;S.worst=worst;
 const bl=b=>`<div><div class="sm mut">${b[0]}</div><b>${b[1]}</b></div>`,cp=v=>v>=70?"High":v>=45?"Moderate":"Low",bi=r.biases;
 $("v2").innerHTML=`<div class="row" style="margin-bottom:12px"><div><h1>Your Financial Plan</h1> <span class="pill g">Synced: Today, ${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})} • Live</span></div><button class="btn l" onclick="print()">Export Summary</button></div>
 <div class="card"><div class="row"><div><span class="lab" style="color:var(--g)">Strategic Roadmap</span> <span class="pill g">Current Stage: ${S.cash.em<6?"Building Reserve":"Wealth Accumulation"}</span><h2 style="margin-top:5px">Visual Financial Roadmap & Lifecycle Timeline (${y0} – ${st[st.length-1].y}+)</h2></div>
 <div class="lg"><span><i style="background:var(--gd)"></i>Completed</span><span><i style="border:2px solid var(--g)"></i>Active Phase</span><span><i style="background:var(--o)"></i>Focus Needed</span><span><i style="background:#c3cadb"></i>Planned Horizon</span></div></div>
 <div class="road">${st.map(s=>`<div class="st ${s.c=="act"?"act":s.c=="focus"?"focus":""}"><div class="ic">${s.c=="done"?"✓":s.ic}</div><div class="y" ${s.c=="focus"?'style="color:var(--o)"':""}>${s.y}</div><b>${s.t}</b><span class="pill ${s.c=="done"||s.c=="act"?"g":s.c=="focus"?"o":""}" style="margin-top:4px">${s.c=="done"||s.c=="sched"?s.pill:s.c=="act"?"Active":s.c=="focus"?"Focus":"Planned"}</span><p>${s.c=="act"||s.c=="focus"?s.pill+"<br>":""}${s.d}</p></div>`).join("")}</div>
 <div class="row"><span class="sm mut"><span style="color:var(--g)">✔</span> Next strategic milestone: <b style="color:var(--ink)">${inrs(first.target_today)} ${first.name} target by Q${Math.ceil((end.getMonth()+1)/3)} ${end.getFullYear()}.</b></span><a href="#" class="sm" style="color:var(--g)" onclick="whyM();return false">View Risk Calibration Insights →</a></div></div>
 <div class="beh"><div><span class="ic">₹</span><span><span class="sm mut">Financial Literacy</span><br><b>${cp(r.fl_pct)}</b></span></div><div><span class="ic">☺</span><span><span class="sm mut">Loss Aversion</span><br><b>${cp(bi.loss_aversion)}</b></span></div><div><span class="ic">◉</span><span><span class="sm mut">Overconfidence</span><br><b>${cp(bi.overconfidence)}</b></span></div><div><span class="ic">↗</span><span><span class="sm mut">Market Behaviour</span><br><b>${bi.panic>=70?"Reactive":bi.panic>=45?"Moderate":"Calm"}</b></span></div></div>
 <div class="card"><div class="row"><h2><span class="lab" style="color:var(--g);margin-right:8px">Milestones</span>Goal Timeline</h2><div class="lg"><span><i style="background:var(--g)"></i>On Track</span><span><i style="background:var(--o)"></i>Needs Adjustment</span></div></div><div class="ms">${st.filter(s=>s.t!="Foundation & Reserve"&&s.t!="Financial Freedom").slice(0,4).map(s=>{const g=s.g,f=g?Math.min(1,g.current_corpus/g.target_today):0;return `<div><div class="row"><b>${s.y}</b>${g?`<span class="pill ${s.c=="focus"?"o":"g"}">${s.c=="focus"?pc(f)+" • +"+inrs(Math.ceil((g.required_sip-g.current_sip)/500)*500):pc(f)+" On Pace"}</span>`:`<span class="pill">Scheduled</span>`}</div><h3 style="margin:6px 0">${s.t}</h3>${g?`<div class="pg ${s.c=="focus"?"o":""}"><i style="width:${f*100}%"></i></div><div class="sm mut" style="margin-top:4px">${inrs(g.current_corpus)} / ${inrs(g.target_today)}</div>`:`<div class="sm mut">Action: <b style="color:var(--ink)">Rebalance & Tax</b></div>`}</div>`}).join("")}</div></div>
 <div class="card"><div class="row"><h2><span class="lab" style="color:var(--g);margin-right:8px">Guidance</span>Personalised Recommendations</h2><span class="sm mut">3 Recommended Moves</span></div><div class="rec">
 <div><div class="row"><span class="pill g">HIGH IMPACT</span><span class="sm mut">SIP Adjustment</span></div><h3 style="font-size:13px">${gap?"Increase monthly SIP":"SIP is on target"}</h3><b>${gap?inrs(gap)+" suggested increase":"No change needed"}</b><span class="sm mut">${gap?`For ${worst.name}, to reduce the projected goal gap.`:"All goals are funded at the planned pace."}</span><button class="btn" onclick="impactSip()">View Impact →</button></div>
 <div><div class="row"><span class="pill">MEDIUM IMPACT</span><span class="sm mut">Rebalance</span></div><h3 style="font-size:13px">${rb.needs_rebalance?"Rebalance portfolio":"Allocation within tolerance"}</h3><b>Equity allocation ${rb.needs_rebalance?"differs from":"matches"} target</b><span class="sm mut">${rb.needs_rebalance?"Current allocation differs from the suggested profile.":"All assets are within 5 pp of target."}</span><button class="btn" onclick="holdM(1)">View Impact →</button></div>
 <div><div class="row"><span class="pill">PROTECTION</span><span class="sm mut">Insurance</span></div><h3 style="font-size:13px">Review insurance coverage</h3><b>Protection check</b><span class="sm mut">Consider protection alongside long-term goals.</span><button class="btn l" onclick="insM()">Review</button></div></div></div>
 <div class="card ad"><div class="row"><div><h2><span style="color:var(--g)">⟳</span> Adaptive Plan</h2><span class="sm mut">Your plan changes when your financial situation changes.</span></div><button class="btn" onclick="recalc()">⟳ Recalculate Plan</button></div>
 <div class="rw"><span>Monthly income</span><span class="mut">${inrs(b.inc)} → <input id="ri" type="number" value="${S.cash.inc}"></span></div><div class="rw"><span>Monthly SIP needed</span><span class="mut">${inrs(b.sip)} → <b style="color:var(--ink)">${inrs(P.total_required_sip)}</b></span></div><div class="rw"><span>Goal progress</span><span class="mut">${pc(b.prog)} → <b style="color:var(--g)">${pc(avgP())}</b></span></div><div class="rw"><span>Monthly surplus</span><span class="mut"><b style="color:${P.feasible?"var(--g)":"var(--r)"}">${inrs(P.surplus)}</b> ${P.feasible?"covers all goals":"short by "+inrs(P.total_required_sip-P.surplus)}</span></div></div>`}
async function recalc(){S.cash.inc=+$("ri").value;await replan();render()}
function renderBell(){const rm=S.plan.reminders,soon=rm.filter(r=>r.urgency=="soon").length;$("bell").innerHTML=`🔔${soon?`<b>${soon}</b>`:""}`;$("pop").innerHTML=`<h3>Reminders (next 90 days)</h3>`+rm.slice(0,8).map(r=>`<div style="padding:7px 0;border-top:1px solid var(--line)"><b>${r.title}</b> <span class="pill ${r.urgency=="soon"?"o":""}">${r.date}</span><div class="sm mut">${r.goal}</div></div>`).join("")+`<h3 style="margin-top:8px">Behavioural nudges</h3>`+S.risk.coaching.map(c=>`<div class="sm mut" style="padding:5px 0">💡 ${c}</div>`).join("")}
const togglePop=()=>$("pop").classList.toggle("on");
/* ---------- modals ---------- */
function whyM(){api("model-card").then(m=>{const r=S.risk;modal(`<div class="row"><h2>Why ${r.label}?</h2><button class="btn l" onclick="closeM()">Close</button></div><p class="mut">Your profile combines what you can afford (risk capacity ${r.capacity}/100: income and financial literacy) with what you can stomach (risk tolerance ${r.tolerance}/100: behaviour under stress). Combined score: <b>${r.score}</b>.</p>${r.adjustments.length?`<p class="sm mut">Adjustments: ${r.adjustments.join("; ")}</p>`:""}<h3>Coaching</h3><ul>${r.coaching.map(c=>`<li>${c}</li>`).join("")}</ul>${r.ml_crosscheck?`<h3>ML cross-check</h3><p>Peer model predicts <b>${r.ml_crosscheck.prediction}</b>. Cross-validated macro-F1 ${m.cv_f1_macro} on ${m.n_rows} investors.</p><p class="sm mut">${m.note}</p>`:""}`)})}
function insM(){const a=S.cash.inc*12;modal(`<div class="row"><h2>Protection check</h2><button class="btn l" onclick="closeM()">Close</button></div><ul><li>Term life cover: roughly 10–15× annual income, i.e. ${inrs(a*10)}–${inrs(a*15)}${S.cash.dep?"; you have "+S.cash.dep+" dependant(s)":""}.</li><li>Health cover: a family floater of ₹10L+ plus a top-up.</li><li>Keep ${Math.max(6,S.cash.em)} months of expenses as emergency fund (you have ${S.cash.em}).</li></ul><p class="sm mut">General guidance, not a product recommendation.</p>`)}
async function impactSip(){if(!S.gap)return modal(`<h2>All goals are on pace</h2><button class="btn" onclick="closeM()">Close</button>`);const w=S.worst,goals=S.goals.map(g=>g.name==w.name?{...g,monthly_sip:g.monthly_sip+S.gap}:g),np=await api("plan",{risk_label:S.risk.label,goals,monthly_income:S.cash.inc,monthly_expenses:S.cash.exp,step_up:.05}),ng=np.goals.find(g=>g.name==w.name);
 modal(`<div class="row"><h2>Impact of +${inrs(S.gap)}/month on ${w.name}</h2><button class="btn l" onclick="closeM()">Close</button></div><p>Chance of reaching the goal: <b>${pc(w.success_prob)}</b> → <b style="color:var(--g)">${pc(ng.success_prob)}</b></p><p class="mut">Median outcome ${inrs(w.projection.p50.at(-1))} → ${inrs(ng.projection.p50.at(-1))} against a target of ${inrs(w.future_cost)} (inflation-adjusted).</p><button class="btn" onclick="S.goals=${JSON.stringify(goals).replace(/"/g,"&quot;")};replan().then(()=>{render();closeM()})">Apply this change</button>`)}
function holdM(auto){modal(`<div class="row"><h2>Portfolio details & rebalancing</h2><button class="btn l" onclick="closeM()">Close</button></div><table><tr><th>Asset</th><th>Invested ₹</th><th>Current ₹</th></tr>${Object.entries(S.hold).map(([k,v],i)=>`<tr><td>${k}</td><td><input type="number" id="hi${i}" value="${v[0]}"></td><td><input type="number" id="hc${i}" value="${v[1]}"></td></tr>`).join("")}</table>
 <div class="g4" style="grid-template-columns:repeat(3,1fr);margin:10px 0"><div><div class="sm mut">New cash ₹</div><input id="nc" type="number" value="0"></div><div><div class="sm mut">Equity drawdown %</div><input id="dd" type="number" value="0"></div><div><div class="sm mut">Drift limit (pp)</div><input id="th" type="number" value="5"></div></div><button class="btn" onclick="doRb()">Check & rebalance</button><div id="rbo" style="margin-top:12px"></div>`);if(auto)doRb()}
async function doRb(){Object.keys(S.hold).forEach((k,i)=>S.hold[k]=[+$("hi"+i).value,+$("hc"+i).value]);save();const r=await api("rebalance",{holdings:Object.fromEntries(Object.entries(S.hold).map(([k,v])=>[k,v[1]])),target:S.risk.allocation.weights,new_cash:+$("nc").value,drawdown:+$("dd").value,threshold:+$("th").value/100,profile:S.risk.label});
 $("rbo").innerHTML=`<div class="note" style="${r.needs_rebalance?"":"background:var(--gl);color:var(--gd)"}">${r.advice}${r.tactical_tilt?" A small equity tilt was applied after the drawdown.":""}</div><table><tr><th>Asset</th><th>Now</th><th>Target</th><th>Action</th></tr>${r.rows.map(x=>`<tr><td>${x.asset}</td><td>${pc(x.current_w)}</td><td>${pc(x.target_w)}</td><td><b>${x.trade>=0?"Buy ":"Sell "}${inrs(Math.abs(x.trade))}</b></td></tr>`).join("")}</table>`;render()}
function goalsM(){modal(`<div class="row"><h2>Edit goals</h2><button class="btn l" onclick="closeM()">Close</button></div><div id="gl">${S.goals.map(goalRow).join("")}</div><div class="row" style="margin-top:8px"><button class="btn l" onclick="$('gl').insertAdjacentHTML('beforeend',goalRow({name:'New goal',category:'Other',target_today:1000000,years:5,current_corpus:0,monthly_sip:5000,priority:2}))">+ Add goal</button><button class="btn" onclick="saveGoals()">Save & rebuild plan</button></div><p class="sm mut">Columns: name, type, cost today (₹), years, saved (₹), SIP (₹/mo), priority 1-3.</p>`)}
const goalRow=g=>`<div class="gr"><input class=n value="${g.name}"><select class=c>${["Education","Home","Retirement","Wedding","Vehicle","Travel","Other"].map(x=>`<option ${x==g.category?"selected":""}>${x}</option>`).join("")}</select><input class=t type=number value="${g.target_today}"><input class=y type=number step=.5 value="${g.years}"><input class=s type=number value="${g.current_corpus}"><input class=m type=number value="${g.monthly_sip}"><select class=p>${[1,2,3].map(x=>`<option ${x==g.priority?"selected":""}>${x}</option>`).join("")}</select></div>`;
async function saveGoals(){S.goals=[...document.querySelectorAll("#gl .gr")].map(d=>({name:d.querySelector(".n").value,category:d.querySelector(".c").value,target_today:+d.querySelector(".t").value,years:+d.querySelector(".y").value,current_corpus:+d.querySelector(".s").value,monthly_sip:+d.querySelector(".m").value,priority:+d.querySelector(".p").value}));await replan();render();closeM()}
/* ---------- boot ---------- */
(async()=>{Q=await api("questionnaire");buildQS();drawQ();if(!S.risk){S.risk=await api("risk-profile",{age:37,income:"6 to 10 lakhs",emergency_months:4,dependents:1,bias:{loss_aversion:4,panic:4,overconfidence:3,fomo:3,herding:3,anchoring:3},quiz:{0:2,1:0,4:0}})}
 if(!S.plan)await replan();if(!S.base)S.base=snap();save();render();tab(0)})();
</script></body></html>
